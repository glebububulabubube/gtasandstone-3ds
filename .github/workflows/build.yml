name: build

on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-3ds:
    name: Build .3dsx + .cia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up devkitPro (pacman)
        run: |
          set -e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          wget -U "${UA}" https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman

      - name: Install 3DS toolchain + citro3d
        run: |
          set -e
          # Пакман devkitPro качает с pkg.devkitpro.org; иногда 403 для curl без UA —
          # подменяем загрузчик на curl с браузерным User-Agent (без heredoc).
          DKPCONF=/opt/devkitpro/pacman/etc/pacman.conf
          if [ -f "$DKPCONF" ] && ! grep -q '^XferCommand' "$DKPCONF"; then
            printf '#!/usr/bin/env bash\nUA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"\nexec /usr/bin/curl -fL --retry 3 -A "$UA" -o "$2" "$1"\n' | sudo tee /usr/local/bin/dkp-dl.sh >/dev/null
            sudo chmod +x /usr/local/bin/dkp-dl.sh
            printf '\n[options]\nXferCommand = /usr/local/bin/dkp-dl.sh %%u %%o\n' | sudo tee -a "$DKPCONF" >/dev/null
          fi
          sudo /opt/devkitpro/pacman/bin/pacman --config "$DKPCONF" -Sy --noconfirm

          # 3ds-dev — это ГРУППА (devkitARM + libctru + citro3d + tools).
          # Пустой ввод в stdin выбирает "all" (поставить всю группу) без интерактива.
          # general-tools даёт makerom/bannertool (нужны для сборки .cia).
          echo "" | sudo /opt/devkitpro/pacman/bin/pacman --config "$DKPCONF" -S --noconfirm 3ds-dev
          echo "" | sudo /opt/devkitpro/pacman/bin/pacman --config "$DKPCONF" -S --noconfirm general-tools

      - name: Verify toolchain
        run: |
          echo "DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}"
          echo "DEVKITARM=${DEVKITARM:-$DEVKITPRO/devkitARM}"
          ls "$DEVKITPRO/libctru/include" >/dev/null && echo "libctru OK"
          ls "$DEVKITPRO/libcitro3d/include" >/dev/null && echo "citro3d OK"
          arm-none-eabi-gcc --version | head -1
          for t in makerom bannertool smdhtool 3dsxtool bin2s; do
            echo -n "$t: "; command -v $t || echo "MISSING"
          done

      - name: Build .3dsx + .cia
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export CTRULIB="$DEVKITPRO/libctru"
          export CT3K="$DEVKITPRO/libcitro3d"
          make -j$(nproc)

      - name: Verify outputs
        run: |
          ls -la gtasandstone.3dsx gtasandstone.cia gtasandstone.smdh gtasandstone.elf || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gtasandstone-3ds
          path: |
            gtasandstone.3dsx
            gtasandstone.cia
            gtasandstone.smdh
          if-no-files-found: error
