      uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          arm-none-eabi-gcc --version | head -1
          echo "--- tools ---"
          for t in makerom bannertool smdhtool 3dsxtool bin2s; do
            echo -n "$t: "; command -v $t || echo "MISSING"
          done

      - name: Build .3dsx + .cia
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export CTRULIB="$DEVKITPRO/libctru"
          export CT3K="$DEVKITPRO/libcitro3d"
          make -j$(nproc)

      - name: Verify outputs
        run: |
          ls -la gtasandstone.3dsx gtasandstone.cia gtasandstone.smdh gtasandstone.elf || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gtasandstone-3ds
          path: |
            gtasandstone.3dsx
            gtasandstone.cia
            gtasandstone.smdh
          if-no-files-found: error
