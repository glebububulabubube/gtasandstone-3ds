name: build

on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-3ds:
    name: Build .3dsx + .cia
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up devkitPro
        uses: devkitPro/github-action-devkitARM@v1

      - name: Install 3DS toolchain + citro3d
        run: |
          sudo dkp-pacman -Sy --noconfirm
          # 3ds-dev: devkitARM + libctru + 3ds-tools (makerom, bannertool, smdhtool, 3dsxtool, bin2s)
          # 3ds-libcitro3d: PICA200 GPU wrapper (citro3d)
          sudo dkp-pacman -S --noconfirm 3ds-dev 3ds-libcitro3d

      - name: Verify toolchain
        run: |
          echo "DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}"
          echo "DEVKITARM=${DEVKITARM:-$DEVKITPRO/devkitARM}"
          ls "$DEVKITPRO/libctru/include" >/dev/null && echo "libctru OK"
          ls "$DEVKITPRO/libcitro3d/include" >/dev/null && echo "citro3d OK"
          arm-none-eabi-gcc --version | head -1
          for t in makerom bannertool smdhtool 3dsxtool bin2s; do
            echo -n "$t: "; command -v $t || echo "MISSING"
          done

      - name: Build .3dsx + .cia
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export CTRULIB="$DEVKITPRO/libctru"
          export CT3K="$DEVKITPRO/libcitro3d"
          make -j$(nproc)

      - name: Verify outputs
        run: |
          ls -la gtasandstone.3dsx gtasandstone.cia gtasandstone.smdh gtasandstone.elf || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gtasandstone-3ds
          path: |
            gtasandstone.3dsx
            gtasandstone.cia
            gtasandstone.smdh
          if-no-files-found: error
