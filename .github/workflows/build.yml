name: build

on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-3ds:
    name: Build .3dsx + .cia
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build makerom (from source)
        run: |
          set -e
          apt-get update -y
          apt-get install -y autoconf automake libtool build-essential libboost-all-dev
          git clone --depth 1 https://github.com/devkitPro/3dstools.git /tmp/3dstools
          cd /tmp/3dstools
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install
          echo "--- installed tools ---"
          ls -la /usr/local/bin/ | grep -i rom || true
          command -v makerom || echo "NO makerom in PATH"

      - name: Build .3dsx
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export CTRULIB="$DEVKITPRO/libctru"
          export CT3K="$DEVKITPRO/libcitro3d"
          make -j$(nproc)

      - name: Build .cia (if makerom available)
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export CTRULIB="$DEVKITPRO/libctru"
          export CT3K="$DEVKITPRO/libcitro3d"
          if command -v makerom >/dev/null 2>&1; then
            make cia
          else
            echo "makerom не найден — сборка .cia пропущена (есть .3dsx)"
          fi
        continue-on-error: true

      - name: Verify outputs
        run: |
          echo "--- files ---"
          ls -la gtasandstone.3dsx gtasandstone.cia gtasandstone.smdh gtasandstone.elf 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gtasandstone-3ds
          path: |
            gtasandstone.3dsx
            gtasandstone.cia
            gtasandstone.smdh
          if-no-files-found: warn
