name: build

on:
  push:
    branches: [ "*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-3ds:
    name: Build .3dsx + .cia
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build makerom (from source)
        run: |
          set -e
          apt-get update -y
          apt-get install -y autoconf automake libtool build-essential libboost-all-dev
          git clone --depth 1 https://github.com/devkitPro/3dstools.git /tmp/3dstools
          cd /tmp/3dstools
          ./autogen.sh
          ./configure
          make -j$(nproc)
          MK=$(find /tmp/3dstools -name makerom -type f | head -1)
          echo "installing makerom from: $MK"
          install -m 755 "$MK" /usr/local/bin/makerom
          makerom || true

      - name: Build .3dsx
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export CTRULIB="$DEVKITPRO/libctru"
          export CT3K="$DEVKITPRO/libcitro3d"
          make -j$(nproc)

      - name: Build .cia
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export CTRULIB="$DEVKITPRO/libctru"
          export CT3K="$DEVKITPRO/libcitro3d"
          make cia

      - name: Verify outputs
        run: |
          ls -la gtasandstone.3dsx gtasandstone.cia gtasandstone.smdh gtasandstone.elf || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gtasandstone-3ds
          path: |
            gtasandstone.3dsx
            gtasandstone.cia
            gtasandstone.smdh
          if-no-files-found: warn
